name: Build Pterodactyl Panel Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/muzammilmonis/ptero-panel-runtime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/muzammilmonis/ptero
            org.opencontainers.image.description=Pterodactyl Panel portable PHP 8.3 ARM64 runtime
